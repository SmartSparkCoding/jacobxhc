<!doctype html>
<html lang="en">
  <head>
    <title>Overview | Jacob X HC</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="overview">
      <h1>Overview of My Stuff at Hack Club!</h1>
      <a style="text-align: right" href="/">Back To Home</a>
      <a style="text-align: right" href="/what">What's What?</a>
    </div>
    {% for project in projects %}
    <div class="project-box-yay">
      <h2>{{ project.name }}</h2>
      <p>{{ project.description }}</p>
      <a href="{{ project.url }}">View Project</a>
    </div>
    {% endfor %}
  </body>
</html>
